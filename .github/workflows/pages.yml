name: Nasazení GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Zjistit adresu GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Sestavit a ověřit web pro jeho skutečnou adresu
        env:
          SITE_BASE: '${{ steps.pages.outputs.base_path }}/'
        run: |
          npm run build -- --base="$SITE_BASE"
          npm run check:build -- --base="$SITE_BASE"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Zveřejnit ověřený build
        id: deployment
        uses: actions/deploy-pages@v4
