<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <title>Refurb.zone — zdroj loga</title>
    <link rel="stylesheet" href="/src/css/styles.css" />
    <link rel="stylesheet" href="/src/css/brand-logo.css" />
    <script src="/src/js/brand-logo.js"></script>
    <style>
      html, body { background: transparent; margin: 0; }
      body { padding: 20px; }
      #logo { display: table; }
      #favicon { position: absolute; left: 20px; top: 150px; width: 512px; height: 512px; }
      #favicon img { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="logo"></div>
    <div id="favicon"><img src="/assets/favicon.svg" alt="Symbol refurb.zone" /></div>
    <script>
      document.getElementById('logo').innerHTML = refurbBrand.markup();
      document.querySelector('.brand-wordmark').id = 'wordmark';
      if (new URLSearchParams(location.search).get('variant') === 'negative') {
        document.querySelector('.brand-logo').classList.add('is-negative');
      }
    </script>
  </body>
</html>
